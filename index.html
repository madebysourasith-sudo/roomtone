<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roomtone — design your apartment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#23201c;--ink2:#5c564d;--ink3:#8d867b;--line:rgba(35,32,28,.1);--soft:rgba(35,32,28,.05);--card:rgba(252,250,246,.96);--acc:#b4553a;--acc-soft:rgba(180,85,58,.1);--ok:#4f7a5a;
  --serif:'Instrument Serif',Georgia,serif;--sans:Geist,system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;--t:.18s ease}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e9e4db;overflow:hidden;font:400 13px/1.45 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#ui{position:fixed;z-index:2;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;pointer-events:none}
#ui>*{pointer-events:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;border-radius:8px;transition:background var(--t),color var(--t),border-color var(--t),opacity var(--t)}
button:focus-visible,input:focus-visible,.it:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{font:inherit;color:inherit}
p{margin:0}
.card{position:absolute;background:rgba(250,247,242,.74);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 0 0 1px rgba(35,32,28,.05),0 14px 36px rgba(35,32,28,.13)}
.lbl{font-size:12px;font-weight:500;color:var(--ink3);display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}

/* left: brand and context */
#L{left:16px;top:16px;width:244px;padding:18px 18px 16px}
h1{margin:0;font:400 34px/1 var(--serif);letter-spacing:-.01em}
#plan{margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#plan b{font-size:14px;font-weight:600}#plan span{font-size:12px;color:var(--ink3);white-space:nowrap}
#ctx{margin-top:6px;font-size:13px;line-height:1.45;color:var(--ink2)}
#read{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.rd{display:grid;grid-template-columns:64px 1fr;align-items:center;height:22px;font-size:12px;color:var(--ink2)}
.rd u{height:3px;border-radius:2px;background:rgba(35,32,28,.1);overflow:hidden;text-decoration:none}
.rd u s{display:block;height:100%;width:0;background:var(--ink);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
#verdict{margin-top:8px;font:italic 400 19px/1.2 var(--serif);color:var(--acc)}

/* right: navigation and the active tool */
#Rr{right:16px;top:16px;bottom:16px;width:316px;display:flex;flex-direction:column;overflow:hidden}
#nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 8px 0;flex:none}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:56px;font-size:11.5px;font-weight:500;color:var(--ink3)}
#nav button:hover{background:var(--soft);color:var(--ink)}
#nav button.on{background:var(--ink);color:#fbf9f5}
#ph{padding:16px 18px 0;flex:none}
#ph h2{margin:0;font:400 27px/1.05 var(--serif)}
#ph p{margin-top:3px;color:var(--ink2)}
#pane{padding:14px 18px 18px;overflow-y:auto;overflow-x:hidden;flex:1;scrollbar-width:thin;scrollbar-color:rgba(35,32,28,.2) transparent}
.note{font-size:13px;color:var(--ink2);margin:0 0 12px}
.empty{font-size:13px;color:var(--ink3);padding:22px 0;text-align:center;grid-column:1/-1}
.rows{margin:0 -8px 14px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border-radius:8px}
button.row:hover{background:var(--soft)}
.row.on{background:var(--acc-soft)}
.row b{font-size:13px;font-weight:500;flex:1}.row em{font-size:12px;font-style:normal;color:var(--ink3)}
.row i.sw1{width:28px;height:28px;border-radius:6px;background-size:cover;box-shadow:inset 0 0 0 1px rgba(35,32,28,.14);flex:none}
.row i.dots{display:flex;flex:none}.row i.dots s{width:16px;height:16px;border-radius:50%;margin-left:-5px;box-shadow:0 0 0 2px #fcfaf6}.row i.dots s:first-child{margin-left:0}
.row .link{font-size:12px;color:var(--ink3);padding:4px 6px}.row .link:hover{color:var(--acc);background:var(--acc-soft)}
.lay{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;width:100%;padding:8px 10px;border-radius:8px}
.lay:hover{background:var(--soft)}.lay.on{background:var(--acc-soft);box-shadow:inset 0 0 0 1.5px var(--acc)}
.lay svg{width:76px;height:54px;display:block}
.lay b{display:block;font-size:14px;font-weight:600}.lay em{display:block;font-size:12px;font-style:normal;color:var(--ink3);margin-top:1px}
.cta{display:block;width:100%;height:40px;background:var(--ink);color:#fbf9f5;font-size:13.5px;font-weight:600;text-align:center}
.cta:hover{background:#3d3831}.cta.warn{background:var(--acc)}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--soft)}
.seg button{flex:1;height:28px;font-size:12.5px;font-weight:500;text-align:center;color:var(--ink2);border-radius:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(35,32,28,.14)}
#q{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.7);padding:0 12px;font-size:13px;margin-top:10px;outline:none;transition:border-color var(--t)}
#q::placeholder{color:var(--ink3)}#q:focus{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.it{border-radius:10px;padding:6px 6px 10px;cursor:pointer;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow var(--t),background var(--t)}
.it:hover{background:#fff;box-shadow:inset 0 0 0 1px rgba(35,32,28,.28)}
.it.on{background:#fff;box-shadow:inset 0 0 0 2px var(--acc)}
.it img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;pointer-events:none}
.it b{display:block;font-size:13px;font-weight:500;line-height:1.25;padding:2px 6px 0}
.it em{display:block;font-size:11.5px;font-style:normal;color:var(--ink3);padding:1px 6px 0}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;margin-top:12px}
.sw{cursor:grab;text-align:center}
.sw i{display:block;height:46px;border-radius:8px;background-size:cover;box-shadow:inset 0 0 0 1px rgba(35,32,28,.14);transition:transform var(--t),box-shadow var(--t)}
.sw:hover i{transform:translateY(-2px)}
.sw.used i{box-shadow:inset 0 0 0 1px rgba(35,32,28,.14),0 0 0 2px #fcfaf6,0 0 0 4px var(--acc)}
.sw.off{opacity:.35}
.sw b{display:block;font-size:11px;font-weight:400;line-height:1.2;margin-top:6px;color:var(--ink2)}
#target{border-radius:10px;padding:12px 14px;margin:0 0 12px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--line)}
#target b{display:block;font-size:14px;font-weight:600}#target em{display:block;font-size:13px;font-style:normal;color:var(--ink2);margin-top:2px}
label.chk{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);cursor:pointer;min-height:32px}
label.chk input{accent-color:var(--acc);margin:0;width:15px;height:15px}
#ghost{position:fixed;width:56px;height:56px;border-radius:10px;background-size:cover;pointer-events:none;z-index:50;transform:translate(-50%,-50%) rotate(4deg);box-shadow:0 0 0 2px #fcfaf6,0 12px 26px rgba(35,32,28,.3);display:none}

/* bottom: history, time of day, view, file */
#dock{left:calc(50% - 36px);bottom:16px;transform:translateX(-50%);height:52px;display:flex;align-items:center;padding:0 8px;white-space:nowrap}
#dock .g{display:flex;align-items:center;gap:1px;padding:0 5px;height:28px;border-right:1px solid var(--line)}
#dock .g:last-child{border:0}
.ib{width:34px;height:36px;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.on{color:var(--acc);background:var(--acc-soft)}
.ib[disabled]{opacity:.3;cursor:default;background:none}
#time{display:flex;align-items:center;gap:8px;width:186px;padding:0 4px 0 6px}
#clock{font:500 13px var(--mono);width:40px}
#scrub{position:relative;flex:1;height:36px;cursor:pointer;touch-action:none}
#scrub:before{content:'';position:absolute;left:0;right:0;top:17px;height:3px;border-radius:2px;background:linear-gradient(90deg,#d9a98c,#efe7d6 30%,#f4f0e6 50%,#efd9b8 72%,#a98a9c 86%,#3a4258)}
#knob{position:absolute;top:10px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px var(--ink),0 2px 6px rgba(35,32,28,.25);transition:transform var(--t)}
#scrub:hover #knob{transform:scale(1.12)}

/* in-scene controls */
#bar{position:absolute;display:none;padding:4px;z-index:30;transform:translate(-50%,0);white-space:nowrap;border-radius:12px}
#bar.show{display:flex;gap:2px;animation:in .16s ease}
@keyframes in{from{opacity:0;transform:translate(-50%,4px)}}
.tb{width:54px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink2)}
.tb:hover{background:var(--soft);color:var(--ink)}
.tb.sm{width:32px}.tb.del:hover{background:var(--acc-soft);color:var(--acc)}
#bar hr{width:1px;height:26px;border:0;background:var(--line);margin:10px 3px}
#rot{position:absolute;display:none;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;color:var(--acc);box-shadow:0 0 0 1.5px var(--acc),0 4px 10px rgba(35,32,28,.25);place-items:center;cursor:grab;z-index:29;touch-action:none;transition:transform var(--t)}
#rot:hover{transform:scale(1.12)}#rot.show{display:grid}
#tip{position:absolute;pointer-events:none!important;background:var(--ink);color:#fbf9f5;border-radius:8px;padding:6px 10px;display:none;z-index:60;white-space:nowrap;font-size:12px}
#tip b{display:block;font-weight:500}
#tip em{display:block;font-style:normal;color:#c9c2b6}
#toast{position:absolute;left:calc(50% - 36px);top:20px;transform:translate(-50%,-6px);background:var(--ink);color:#fbf9f5;border-radius:10px;padding:9px 14px;font-size:13px;opacity:0;transition:opacity var(--t),transform var(--t);pointer-events:none!important;white-space:nowrap;display:flex;gap:14px;align-items:center;z-index:55}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast button{color:#f4c9b8;font-weight:500;pointer-events:auto;border-radius:4px}
#toast button:hover{color:#fff}
#spot{position:absolute;pointer-events:none!important;border-radius:14px;box-shadow:0 0 0 2px var(--acc),0 0 0 7px rgba(180,85,58,.16);display:none;z-index:70;transition:left .22s ease,top .22s ease,width .22s ease,height .22s ease}
#coach{position:absolute;display:none;width:272px;padding:16px 18px 14px;z-index:71;transition:left .22s ease,top .22s ease}
#coach small{font:400 11.5px var(--mono);color:var(--ink3)}
#coach h3{margin:4px 0 4px;font:400 22px/1.1 var(--serif)}
#coach p{color:var(--ink2)}
#coach footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
#coach .skip{font-size:12px;color:var(--ink3);padding:4px 0}#coach .skip:hover{color:var(--ink)}
#coach .go{height:30px;padding:0 14px;background:var(--ink);color:#fbf9f5;font-size:12.5px;font-weight:500}
/* studio pass: tools, ambience bar, glass object card, lamp pins, focus */
#tools{left:16px;bottom:16px;width:244px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px}
#tools .ib{width:100%}
#amb{left:calc(50% - 36px);bottom:16px;transform:translateX(-50%);height:56px;display:flex;align-items:center;gap:2px;padding:0 8px;border-radius:28px;white-space:nowrap}
#amb hr{width:1px;height:26px;border:0;background:var(--line);margin:0 6px}
.sc{display:flex;align-items:center;gap:8px;height:40px;padding:0 13px 0 8px;border-radius:20px;font-size:13px;font-weight:500;color:var(--ink)}
.sc i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(35,32,28,.1),0 1px 3px rgba(35,32,28,.15)}
.sc:hover{background:var(--soft)}
.sc.on,#amb .ib.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(35,32,28,.16)}
#amb .ib{border-radius:50%;width:36px}
#clock{font:500 12.5px var(--mono);color:var(--ink2);padding:0 8px 0 6px;min-width:52px}
.tw{margin-bottom:20px}.tw .lbl span:last-child{color:var(--ink2)}
#fade{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .17s ease}
#fade.on{opacity:1}
#rooms{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#rooms:empty{display:none}
.rc{height:28px;padding:0 11px;border-radius:14px;background:rgba(35,32,28,.06);font-size:12.5px;font-weight:500;color:var(--ink2)}
.rc:hover{background:rgba(35,32,28,.11);color:var(--ink)}
.rc.on{background:var(--ink);color:#fbf9f5}
#card{display:none;width:272px;padding:14px 14px 12px;border-radius:24px;z-index:30}
#card.show{display:block;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
#card header{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}
#card .tile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(35,32,28,.07);color:var(--ink2)}
#card .tile.warm{background:linear-gradient(160deg,#ffd9a8,#efa457);color:#5a3510}
#card header b{display:block;font-size:15px;font-weight:600;line-height:1.2}
#card header span{display:block;font-size:12.5px;color:var(--ink3);line-height:1.3}
.tog{width:46px;height:28px;border-radius:14px;background:rgba(35,32,28,.18);position:relative;flex:none}
.tog i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform var(--t)}
.tog.on{background:#e3963c}.tog.on i{transform:translateX(18px)}
.bright{position:relative;height:42px;border-radius:13px;background:rgba(35,32,28,.08);margin-top:14px;overflow:hidden;cursor:ew-resize;touch-action:none}
.bright .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f7c886,#ef9f4e)}
.bright span{position:relative;display:flex;align-items:center;gap:6px;height:100%;padding:0 12px;font-size:13.5px;font-weight:600;color:#3d2a14;pointer-events:none}
#card .dots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;margin-top:12px;justify-items:center}
#card .dots.fin{grid-template-columns:repeat(6,1fr);margin-top:8px}
.dot{width:30px;height:30px;border-radius:50%;background-size:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform var(--t),box-shadow var(--t)}
.dot:hover{transform:scale(1.08)}.dot.on{box-shadow:0 0 0 2px #fbf8f3,0 0 0 3.5px var(--ink)}
.more{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(35,32,28,.07);color:var(--ink2)}.more:hover{background:rgba(35,32,28,.13);color:var(--ink)}
#card .cap{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--ink3);margin-top:14px}#card .cap span{font-weight:400;color:var(--ink2)}
#card .link{display:block;font-size:12px;color:var(--ink3);margin-top:10px;padding:2px 0}#card .link:hover{color:var(--acc)}
#card footer{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin:14px -6px 0;padding-top:10px;border-top:1px solid var(--line)}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:46px;border-radius:12px;font-size:10.5px;font-weight:500;color:var(--ink2)}
.chip:hover{background:rgba(35,32,28,.07);color:var(--ink)}.chip.del:hover{background:var(--acc-soft);color:var(--acc)}
#badges{position:absolute;inset:0;pointer-events:none!important}
.bdg{position:absolute;width:30px;height:30px;margin:-56px 0 0 -15px;border-radius:50%;display:grid;place-items:center;pointer-events:auto;background:rgba(250,247,242,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 3px 10px rgba(35,32,28,.22);color:var(--ink3)}
.bdg::after{content:'';position:absolute;left:14.5px;top:30px;width:1px;height:21px;background:rgba(255,255,255,.9)}
.bdg::before{content:'';position:absolute;left:12px;top:50px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.9)}
.bdg:hover{transform:scale(1.08)}.bdg.on{color:#e0862a}.bdg.sel{box-shadow:0 0 0 2px #e3963c,0 3px 10px rgba(35,32,28,.22)}
/* glass: frosted, translucent panels with a bright edge, white pills for whatever is active */
.card{background:linear-gradient(155deg,rgba(255,255,255,.58),rgba(250,246,240,.36));-webkit-backdrop-filter:blur(32px) saturate(1.8);backdrop-filter:blur(32px) saturate(1.8);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.42),0 18px 44px rgba(35,32,28,.16),0 2px 6px rgba(35,32,28,.06)}
#L,#Rr{border-radius:28px}
#Rr{background:linear-gradient(170deg,rgba(255,255,255,.6),rgba(250,246,240,.42))}
#nav{padding:10px 10px 0;gap:4px}
#nav button{border-radius:16px}
#nav button.on{background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 1px 4px rgba(35,32,28,.14),inset 0 0 0 1px rgba(255,255,255,.9)}
#nav button:hover:not(.on){background:rgba(255,255,255,.4)}
.seg{background:rgba(35,32,28,.06);border-radius:14px;padding:4px}
.seg button{border-radius:10px}
.seg button.on{background:rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(35,32,28,.14)}
#q{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.65);border-radius:14px}
#q:focus{background:rgba(255,255,255,.7)}
.it{background:rgba(255,255,255,.36);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);border-radius:18px}
.it:hover{background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 6px 16px rgba(35,32,28,.1)}
.it.on{background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 2px var(--acc)}
.row,.lay{border-radius:14px}
button.row:hover,.lay:hover{background:rgba(255,255,255,.42)}
.row.on{background:rgba(255,255,255,.7)}
.lay.on{background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1.5px var(--acc)}
#target{background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);border-radius:16px}
.cta{border-radius:16px;height:42px;background:rgba(35,32,28,.88)}
.rc{background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.rc:hover{background:rgba(255,255,255,.65)}
.rc.on{background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 1px 4px rgba(35,32,28,.16)}
#read{border-top-color:rgba(255,255,255,.55)}
#tools{border-radius:24px}
#tools .ib,#amb .ib{border-radius:14px}
#tools .ib:hover,#amb .ib:hover,.sc:hover{background:rgba(255,255,255,.5)}
#tools .ib.on{background:rgba(255,255,255,.88);color:var(--acc);box-shadow:0 1px 3px rgba(35,32,28,.14)}
#amb{border-radius:30px}
#amb .ib{border-radius:50%}
#card{border-radius:28px}
#card .tile{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.bright{background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);border-radius:15px}
.chip:hover{background:rgba(255,255,255,.55)}
#card footer{border-top-color:rgba(255,255,255,.6)}
